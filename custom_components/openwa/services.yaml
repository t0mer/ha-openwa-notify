send_message:
  fields:
    config_entry_id:
      required: false
      selector:
        config_entry:
          integration: openwa
    target:
      required: true
      example: "972501234567"
      selector:
        text:
          multiple: true
    title:
      required: false
      selector:
        text:
    message:
      required: false
      example: "The front door is open"
      selector:
        text:
          multiline: true
    media:
      required: false
      example: "/config/www/snapshot.jpg"
      selector:
        text:
    media_type:
      required: false
      selector:
        select:
          translation_key: media_type
          options:
            - image
            - video
            - audio
            - document
    as_voice:
      required: false
      default: false
      selector:
        boolean:
    latitude:
      required: false
      example: 32.0853
      selector:
        number:
          min: -90
          max: 90
          step: any
          mode: box
    longitude:
      required: false
      example: 34.7818
      selector:
        number:
          min: -180
          max: 180
          step: any
          mode: box
    location_name:
      required: false
      example: "Home"
      selector:
        text:
    address:
      required: false
      example: "1 Main St, Tel Aviv"
      selector:
        text:
